[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mockboard"
version = "0.1.0"
description = "Mock Board: a voice-first Hinglish UPSC Personality Test board (phase 1: text-only brain)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Mock Board owner" }]
# Exact pins live in requirements.txt; these are the compatible ranges.
dependencies = [
  "langgraph>=1.2,<1.3",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.16,<3",
  "boto3>=1.43,<2",
  "websockets>=17,<18",
  "httpx>=0.28,<0.29",
  "PyYAML>=6,<7",
  "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.17,<0.18"]
# Day-1 probes only (resampling and speech-length checks); exact pins in requirements-probes.txt.
probes = ["numpy>=2.5,<3", "scipy>=1.18,<2"]

[project.scripts]
mockboard-cli = "mockboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mockboard = ["prompts/*.md", "brain/personas/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning:botocore.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "probes", "eval"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Hinglish/Devanagari text and typographic dashes are intentional

[tool.ruff.lint.per-file-ignores]
# The strategist docstring holds the rule table (the spec); keep it as one readable table.
"src/mockboard/brain/strategist.py" = ["E501"]
