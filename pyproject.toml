[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mockboard"
version = "0.1.0"
description = "Mock Board: a voice-first Hinglish UPSC Personality Test board (phase 1: text-only brain)."
readme = "README.md"
requires-python = ">=3.12"  # numpy 2.5 (probes extra) needs 3.12+; EC2 Ubuntu 24.04 ships 3.12
license = { text = "Proprietary" }
authors = [{ name = "Mock Board owner" }]
# Exact pins live in requirements.txt; these are the compatible ranges.
dependencies = [
  "langgraph>=1.2,<1.3",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.16,<3",
  "boto3>=1.43,<2",
  "websockets>=15,<16",  # capped by pipecat-gnani 0.5.12 (ruling 18)
  "httpx>=0.28,<0.29",
  "PyYAML>=6,<7",
  "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.17,<0.18"]
# Day-1 probes only (resampling and speech-length checks); exact pins in requirements-probes.txt.
probes = ["numpy>=2.5,<3", "scipy>=1.18,<2"]
# Phase 2 voice loop (ruling 16, ADR-001, ADR-007), exact pins. pipecat-ai 1.5.0 is the version
# Gnani says it tested pipecat-gnani with. Pipecat's online docs describe newer releases: read
# the 1.5.0 source when they disagree (spikes/NOTES.md lists the real names).
# * pipecat-ai extras: `runner` (FastAPI, uvicorn, python-dotenv) and `silero` (empty in
#   1.5.0, kept so the intent is explicit). Silero VAD and Smart Turn v3 ship inside the base
#   wheel with their ONNX models.
# * NOT pipecat-ai's `webrtc` extra: it adds opencv-python, whose macOS wheel bundles its own
#   FFmpeg libavdevice next to PyAV's (aiortc's), and macOS warns about the duplicate classes
#   (defect E, Round 19). OpenCV is only used by SmallWebRTC for video frames, which we never
#   take, so we depend on aiortc directly (what `[webrtc]` resolved, plus PyAV through it) and
#   `mockboard.voice.cv2_shim` stands in for the transport's module-level `import cv2`.
# * gnani-vachana 0.7.9, NOT 0.8.2: with 0.8.2 `import pipecat_gnani` fails (0.8.2 removed
#   `TIMBRE_V20_VOICES`, which pipecat-gnani 0.5.12 imports). 0.7.9 is the 0.7 line Gnani tested
#   and the fallback ADR-001 names. Checked by importing in a fresh venv, Oct 29, 2026.
# * aiortc is pinned because WebRTC behaviour lives there.
# websockets is capped below 16 in the base dependencies so this extra installs into the same
# environment (ruling 18; the probes and brain were verified on websockets 15.0.1).
voice = [
  "pipecat-ai[runner,silero]==1.5.0",
  "pipecat-gnani==0.5.12",
  "gnani-vachana==0.7.9",
  "aiortc==1.15.0",
]

[project.scripts]
mockboard-cli = "mockboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mockboard = ["prompts/*.md", "brain/personas/*.yaml", "brain/personas/debate/*.yaml",
             "brain/personas/panel/*.yaml", "voice/static/*.html", "voice/static/*.css",
             "voice/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning:botocore.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "probes", "eval"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Hinglish/Devanagari text and typographic dashes are intentional

[tool.ruff.lint.per-file-ignores]
# The strategist docstring holds the rule table (the spec); keep it as one readable table.
"src/mockboard/brain/strategist.py" = ["E501"]
