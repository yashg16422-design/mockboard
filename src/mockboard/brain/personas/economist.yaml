fallback_lines:
  - "Hmm, ek pal. Aap apna tark aage badhaiye, iska asar kis par padega?"
  - "Interesting. Isi baat ko thoda aur khol kar samjhaiye."
  - "Achha, ek pal. Aap jaari rakhiye, mujhe doosra pehlu bhi sunna hai."
