id: humanities
name: "Professor Sen"
title: "Professor of humanities (fictional)"
role: member
topics: ["interests"]
domain: "The candidate's hobbies and optional subject"
# Placeholder: voices are config only (Ruling 39, CTO_NOTES_06 section 6).
voice_id: "PLACEHOLDER_SET_AFTER_TIMBRE_PROBE"
# Names from CTO_NOTES_06 section 6, in gnani_protocol.py: both Timbre v3.0.
